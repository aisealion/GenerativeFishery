# Model config for LLM_PROVIDER=ollama (a local Ollama server, OpenAI-
# compatible at OLLAMA_BASE_URL, default http://localhost:11434/v1). Every
# LLMCallType is listed explicitly -- see models_litellm.yaml for why that
# matters here (no Claude-flavored fallback makes sense against this
# provider).
#
# One local model (gpt-oss-20b-32k) for everything -- no cost tiering needed
# since local inference has no per-call API cost, though you may still want
# to route high-volume calls to a smaller local model for latency.
#
# `gpt-oss-20b-32k`, not the plain `gpt-oss:20b` you actually `ollama pull` --
# it's a locally-created variant (`ollama create gpt-oss-20b-32k -f
# Modelfile` with `FROM gpt-oss:20b` + `PARAMETER num_ctx 32768`, see
# deploy/aoraki_run.slurm) with a larger context window. Ollama defaults
# every model to a 4096-token window unless overridden this way, which is
# too small for gpt-oss's reasoning to fit input + chain-of-thought + an
# actual answer -- confirmed in practice as a silent failure (a response
# with only reasoning content and no final answer at all, not even a
# `finish_reason='length'` error) rather than the merely-tight-budget
# problem the retry loop below can recover from.
#
# gpt-oss is a reasoning model: it spends tokens on chain-of-thought before
# ever emitting the tool call, so max_tokens needs real headroom above what
# the response schema itself requires -- too tight a budget here causes
# `finish_reason='length'` with no tool call at all (see
# OpenAICompatibleLLMClient's retry-with-feedback loop, which helps recover
# from an occasional bad response but can't fix a budget that's always
# too small -- retrying into the same too-small budget just fails the same
# way again, confirmed in practice for norm_compiler at the old 1024).
# Every budget below is at least 2048 for this reason, even for call types
# that haven't been observed failing yet -- the reasoning overhead isn't
# specific to any one call type, so there's no reason to expect the ones
# still at a smaller value to be safe, only that they haven't come up yet.
calls:
  effort_decision:
    model: gpt-oss-20b-32k
    max_tokens: 2048
    temperature: 1.0
  vote:
    model: gpt-oss-20b-32k
    max_tokens: 2048
    temperature: 1.0
  election_decision:
    model: gpt-oss-20b-32k
    max_tokens: 2048
    temperature: 1.0
  importance_rating:
    model: gpt-oss-20b-32k
    max_tokens: 2048
    temperature: 0.0
  disclosure:
    model: gpt-oss-20b-32k
    max_tokens: 2048
    temperature: 1.0
  proposal:
    model: gpt-oss-20b-32k
    # 3072 -- fills personal_norm + community_proposal, on top of gpt-oss's
    # own reasoning overhead.
    max_tokens: 3072
    temperature: 1.0
  councillor_reply:
    model: gpt-oss-20b-32k
    # 4096 -- confirmed in practice that gpt-oss tends toward long,
    # discursive answers in this back-and-forth (economic-reasoning-style
    # paragraphs, not a short reply), and a too-tight budget here doesn't
    # just truncate cleanly -- it can cut the tool call's JSON off
    # mid-string, which Ollama itself then fails to parse server-side (see
    # OpenAICompatibleLLMClient's 5xx retry path).
    max_tokens: 4096
    temperature: 1.0
  monitor_review:
    model: gpt-oss-20b-32k
    max_tokens: 2048
    temperature: 1.0
  reflection:
    model: gpt-oss-20b-32k
    max_tokens: 3072
    temperature: 1.0
