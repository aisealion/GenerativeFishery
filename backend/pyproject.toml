[project]
name = "genfishery"
version = "0.1.0"
description = "Multi-fishery LLM governance simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "anthropic>=0.34",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gdm-concordia>=2.4.0",
    "sentence-transformers>=5.6.0",
    "numpy>=2.5.1",
    "openai>=2.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genfishery"]
