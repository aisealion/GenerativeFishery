services:
  postgres:
    image: timescale/timescaledb:2.17.1-pg16
    environment:
      POSTGRES_USER: genfishery
      POSTGRES_PASSWORD: genfishery
      POSTGRES_DB: genfishery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genfishery -d genfishery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
